<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: sans-serif;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  #btn {
    width: 46px;
    height: 38px;
    border-radius: 8px;
    border: 1px solid rgba(49, 51, 63, 0.2);
    background: #EFE9D9;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none; /* el body captura el puntero, no el botón — ver abajo */
    transition: background 0.15s, transform 0.1s;
  }
  #btn.recording {
    background: #C08A34;
    transform: scale(0.97);
  }
  #btn.processing {
    background: #8a8a8a;
    opacity: 0.85;
  }
  #btn.disabled {
    opacity: 0.5;
  }
  #btn.busy {
    animation: shake 0.3s;
  }
  @keyframes shake {
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
</style>
</head>
<body>
<button id="btn" type="button" title="Mantén presionado para hablar">🎙️</button>
<script>
// Componente Streamlit "a mano" (sin build step, sin streamlit-component-lib):
// implementa el protocolo postMessage directamente.
//
// Push-to-talk real con Pointer Events + setPointerCapture: el botón vive
// en un iframe de solo unos px — en un gesto real de "mantener presionado"
// la mano tiembla lo suficiente como para que el cursor salga de esa área
// chica, y ahí el mouseup/touchend deja de dispararle al botón (o incluso
// a la ventana del iframe entera, los eventos de mouse no cruzan de un
// iframe a la página principal). setPointerCapture en el <body> completo
// (que llena todo el iframe) resuelve esto de forma estándar: una vez que
// se captura el puntero al presionar, TODOS los eventos de ese puntero
// —incluido soltar— quedan garantizados para este documento sin importar
// a dónde se mueva el cursor dentro del iframe. Además hay un timeout duro
// como red de seguridad por si el cursor de verdad sale del iframe.
const body = document.body;
const btn = document.getElementById("btn");
let recognition = null;
let lang = "es-ES";
let listening = false;
let hardStopTimer = null;
// Techo total del gesto completo (puede incluir varias sesiones
// encadenadas si el motor se reinicia solo), no por sesión individual.
const MAX_RECORDING_MS = 30000;

function post(payload) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, payload), "*");
}

function sendValue(value) {
  post({ type: "streamlit:setComponentValue", value: value, dataType: "json" });
}

function setFrameHeight() {
  post({ type: "streamlit:setFrameHeight", height: 46 });
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || data.type !== "streamlit:render") return;
  const args = data.args || {};
  if (args.language) lang = args.language;
});

post({ type: "streamlit:componentReady", apiVersion: 1 });
setFrameHeight();

const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognitionImpl) {
  btn.textContent = "🎙️ N/D";
  btn.classList.add("disabled");
  btn.title = "Tu navegador no soporta reconocimiento de voz (usa Chrome o Edge).";
} else {
  let fullTranscript = "";
  // `held`: ¿el usuario sigue con el dedo/mouse presionado ahora mismo?
  // `listening`: ¿hay una sesión de recognition activa ahora mismo?
  // Son cosas distintas: Chrome a veces termina una sesión sola (pausas
  // largas, límites internos del motor) aunque el usuario siga con el
  // botón presionado — antes eso cortaba la frase a la mitad y perdía
  // todo lo que se dijera después. Ahora, si `held` sigue en true cuando
  // llega onend, se reinicia la escucha sola en vez de terminar,
  // encadenando sesiones sin perder lo ya transcrito.
  let held = false;

  function startRec() {
    if (listening) return;
    recognition = new SpeechRecognitionImpl();
    recognition.lang = lang;
    // continuous=true: sin esto, el navegador decide solo cuándo
    // "terminaste de hablar" (apenas detecta una pausa) y corta la sesión,
    // en vez de esperar a que sueltes el botón.
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          const piece = e.results[i][0].transcript.trim();
          if (piece) fullTranscript += (fullTranscript ? " " : "") + piece;
        }
      }
    };
    recognition.onerror = (e) => {
      listening = false;
      // "no-speech" es común y no destructivo (silencio momentáneo) — si
      // se sigue presionando el botón, se reintenta en vez de rendirse.
      if (held && e.error === "no-speech") {
        startRec();
        return;
      }
      held = false;
      clearTimeout(hardStopTimer);
      btn.classList.remove("recording", "processing");
    };
    recognition.onend = () => {
      listening = false;
      if (held) {
        // El motor cortó la sesión solo pero el botón sigue presionado —
        // se reinicia sin avisar (ni enviar nada todavía) para no perder
        // el resto de lo que el usuario siga diciendo.
        startRec();
        return;
      }
      // Entre llamar a recognition.stop() (al soltar) y que este evento
      // realmente dispare puede pasar varios segundos — el motor de
      // reconocimiento de Chrome sigue "cerrando" la sesión con su backend
      // en la nube antes de soltar el resultado final. Eso es inherente a
      // la Web Speech API, no un bug del botón — pero el botón sí deja de
      // verse "pegado en grabación" apenas se suelta (ver stopRec), en vez
      // de quedarse así hasta que esto llegue.
      clearTimeout(hardStopTimer);
      btn.classList.remove("recording", "processing");
      if (fullTranscript.trim()) {
        sendValue({ text: fullTranscript.trim(), id: Date.now() });
      }
    };
    try {
      recognition.start();
      listening = true;
      btn.classList.remove("processing");
      btn.classList.add("recording");
    } catch (err) {
      listening = false;
    }
  }

  function stopRec() {
    held = false;
    if (recognition && listening) {
      // Feedback visual inmediato: al soltar, se ve al toque que dejó de
      // grabar y está procesando, en vez de seguir pareciendo "grabando"
      // los varios segundos que tarda onend en llegar de verdad.
      btn.classList.remove("recording");
      btn.classList.add("processing");
      recognition.stop();
    }
  }

  body.addEventListener("pointerdown", (e) => {
    if (listening) {
      // Sesión anterior todavía cerrando en el fondo (el delay de varios
      // segundos de onend) — se ignora el nuevo press, pero con una señal
      // visual en vez de no hacer nada sin explicación.
      btn.classList.add("busy");
      setTimeout(() => btn.classList.remove("busy"), 300);
      return;
    }
    body.setPointerCapture(e.pointerId);
    held = true;
    fullTranscript = ""; // se resetea solo al iniciar un gesto de presión nuevo, no en cada reinicio interno
    clearTimeout(hardStopTimer);
    // Red de seguridad para todo el gesto (no por sesión individual, ya
    // que ahora puede haber varias encadenadas): si por lo que sea nunca
    // se detecta el soltar, esto corta igual en vez de escuchar ruido
    // ambiente sin límite.
    hardStopTimer = setTimeout(stopRec, MAX_RECORDING_MS);
    startRec();
  });
  body.addEventListener("pointerup", stopRec);
  body.addEventListener("pointercancel", stopRec);
  // Salvavidas final: si el puntero se pierde por completo (cambia de
  // ventana, alt-tab, etc.) sin disparar pointerup/pointercancel.
  window.addEventListener("blur", stopRec);
}
</script>
</body>
</html>
