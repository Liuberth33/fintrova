<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: sans-serif; }
  #btn {
    width: 100%;
    height: 38px;
    border-radius: 8px;
    border: 1px solid rgba(49, 51, 63, 0.2);
    background: #EFE9D9;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    transition: background 0.15s, transform 0.1s;
  }
  #btn.recording {
    background: #C08A34;
    transform: scale(0.97);
  }
  #btn.processing {
    background: #8a8a8a;
    opacity: 0.85;
  }
  #btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<button id="btn" type="button" title="Mantén presionado para hablar">🎙️</button>
<script>
// Componente Streamlit "a mano" (sin build step, sin streamlit-component-lib):
// implementa el protocolo postMessage directamente. Push-to-talk real
// (mousedown/touchstart en el botón empieza a grabar; mouseup/touchend
// escuchados en window, no solo en el botón, detienen) usando la Web
// Speech API nativa del navegador — sin backend de transcripción propio
// ni servicios de terceros no oficiales.
const btn = document.getElementById("btn");
let recognition = null;
let lang = "es-ES";
let listening = false;

function post(payload) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, payload), "*");
}

function sendValue(value) {
  post({ type: "streamlit:setComponentValue", value: value, dataType: "json" });
}

function setFrameHeight() {
  post({ type: "streamlit:setFrameHeight", height: 46 });
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || data.type !== "streamlit:render") return;
  const args = data.args || {};
  if (args.language) lang = args.language;
});

post({ type: "streamlit:componentReady", apiVersion: 1 });
setFrameHeight();

const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognitionImpl) {
  btn.textContent = "🎙️ N/D";
  btn.disabled = true;
  btn.title = "Tu navegador no soporta reconocimiento de voz (usa Chrome o Edge).";
} else {
  let fullTranscript = "";

  function startRec() {
    if (listening) return;
    fullTranscript = "";
    recognition = new SpeechRecognitionImpl();
    recognition.lang = lang;
    // continuous=true es la parte clave: sin esto, el navegador decide por
    // su cuenta cuándo "terminaste de hablar" (apenas detecta una pausa) y
    // corta la sesión sola, en vez de esperar a que sueltes el botón —
    // eso se sentía como un corte fijo a los ~5s en frases con pausas
    // naturales. Con continuous=true sigue escuchando y acumulando
    // resultados hasta que se llama recognition.stop() explícitamente.
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          const piece = e.results[i][0].transcript.trim();
          if (piece) fullTranscript += (fullTranscript ? " " : "") + piece;
        }
      }
    };
    recognition.onerror = () => {
      listening = false;
      btn.classList.remove("recording", "processing");
    };
    recognition.onend = () => {
      // Entre llamar a recognition.stop() y que este evento realmente
      // dispare puede pasar varios segundos — el motor de reconocimiento
      // de Chrome sigue "cerrando" la sesión con su backend en la nube
      // antes de soltar el resultado final. Eso es inherente a la Web
      // Speech API en modo continuous, no un bug del botón — pero el botón
      // sí puede (y debía) dejar de verse "pegado en grabación" apenas se
      // suelta, en vez de quedarse con el estado "recording" hasta acá.
      listening = false;
      btn.classList.remove("recording", "processing");
      if (fullTranscript.trim()) {
        sendValue({ text: fullTranscript.trim(), id: Date.now() });
      }
    };
    try {
      recognition.start();
      listening = true;
      btn.classList.remove("processing");
      btn.classList.add("recording");
    } catch (err) {
      listening = false;
    }
  }

  function stopRec() {
    if (recognition && listening) {
      // Feedback visual inmediato: al soltar, se ve al toque que dejó de
      // grabar y está procesando, en vez de seguir pareciendo "grabando"
      // durante los varios segundos que tarda onend en llegar de verdad.
      btn.classList.remove("recording");
      btn.classList.add("processing");
      recognition.stop();
    }
  }

  btn.addEventListener("mousedown", startRec);
  btn.addEventListener("touchstart", (e) => { e.preventDefault(); startRec(); });

  // El soltar se escucha en window, no solo en el botón: si el cursor se
  // corre un poco mientras se mantiene presionado (normal en un gesto de
  // "mantener apretado"), el mouseup puede terminar disparando sobre otro
  // elemento y nunca llegarle al botón — dejando la grabación realmente
  // encendida de fondo aunque visualmente pareciera soltado.
  window.addEventListener("mouseup", stopRec);
  window.addEventListener("touchend", (e) => { e.preventDefault(); stopRec(); });
  window.addEventListener("touchcancel", (e) => { e.preventDefault(); stopRec(); });
  btn.addEventListener("touchcancel", (e) => { e.preventDefault(); stopRec(); });
}
</script>
</body>
</html>
